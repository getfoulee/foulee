<!doctype html>
<html
  lang="fr"
  data-composition-variables='[{"id":"locale","type":"enum","label":"Langue","default":"fr","options":[{"value":"fr","label":"Français"},{"value":"en","label":"English"}]}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=886, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/app.css" />
    <script src="assets/i18n.js"></script>
    <style>
      /* Foulée's App Store preview for the iPhone Duo.
         886 × 1920 is the only portrait size App Store Connect accepts for an
         iPhone Duo preview, so the film is drawn at that size and the device
         inside it keeps the inner screen's own proportions (2007 × 2853). */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 886px;
        height: 1920px;
        overflow: hidden;
        background: #f7f0fd;
        font-family: "Inter", sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* The ground: the same pastel wash as the 6.9" preview. */
      #ground {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: linear-gradient(180deg, #f8eefe 0%, #f4effd 45%, #f3f1fd 70%, #fbf1f8 100%);
      }
      #ground i {
        position: absolute;
        border-radius: 50%;
        filter: blur(110px);
      }
      #blob-a { width: 760px; height: 640px; left: -260px; top: -240px; background: #f2c4ff; opacity: 0.9; }
      #blob-b { width: 700px; height: 700px; right: -330px; top: 560px; background: #dcc8ff; opacity: 0.85; }
      #blob-c { width: 680px; height: 640px; left: -330px; top: 1100px; background: #cfdfff; opacity: 0.85; }
      #blob-d { width: 720px; height: 620px; right: -300px; bottom: -260px; background: #ffd9ec; opacity: 0.9; }

      /* The iPhone Duo, unfolded, in portrait. The screen is 669 × 951 pt: one
         CSS pixel is one point, so the scenes inside are drawn at the app's
         own sizes. */
      #rig {
        position: absolute;
        left: 95px;
        top: 556px;
        width: 697px;
        height: 979px;
        z-index: 10;
      }
      #device {
        position: absolute;
        inset: 0;
        border-radius: 60px;
        padding: 14px;
        background: linear-gradient(145deg, #3d3549, #17121f 38%, #2b2435 70%, #1a1522);
        box-shadow:
          0 0 0 1.5px #4d4459,
          0 46px 90px -24px rgb(60 20 110 / 0.45),
          0 18px 40px -10px rgb(30 10 60 / 0.3);
      }
      #device .button-r {
        position: absolute;
        right: -4px;
        width: 4px;
        border-radius: 0 3px 3px 0;
        background: #2c2536;
      }
      #screen {
        position: relative;
        width: 669px;
        height: 951px;
        border-radius: 46px;
        overflow: hidden;
        background: #fbf7ff;
        isolation: isolate;
      }
      /* Each scene paints in its own stacking context, so a sheet's dim and
         card stay inside their scene and the hosts stack in DOM order. */
      #screen > [data-composition-src],
      #screen [data-composition-id] {
        position: absolute;
        inset: 0;
        isolation: isolate;
      }
      #camera {
        position: absolute;
        left: 50%;
        top: 13px;
        width: 13px;
        height: 13px;
        margin-left: -6.5px;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, #2e3550, #05060a 60%);
        z-index: 100;
      }
      #glare {
        position: absolute;
        inset: 0;
        border-radius: 46px;
        background: linear-gradient(125deg, rgb(255 255 255 / 0.1), transparent 30%);
        z-index: 99;
        pointer-events: none;
      }
    </style>
  </head>

    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="886"
      data-height="1920"
      data-fps="30"
    >
      <div id="ground" data-layout-ignore>
        <i id="blob-a"></i>
        <i id="blob-b"></i>
        <i id="blob-c"></i>
        <i id="blob-d"></i>
      </div>

      <div
        id="intro"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="2.6"
        data-track-index="5"
        data-track-kind="graphics"
        data-width="886"
        data-height="1920"
        style="z-index: 5"
      ></div>

        <div id="device">
          <i class="button-r" style="top: 190px; height: 74px"></i>

    <script>
      window.__timelines = window.__timelines || {};
      Foulee.apply();
      const tl = gsap.timeline({ paused: true });

      // The ground drifts, slowly, the whole film long.
      tl.fromTo("#blob-a", { x: 0, y: 0 }, { x: 140, y: 90, duration: 30, ease: "sine.inOut" }, 0);
      tl.fromTo("#blob-b", { x: 0, y: 0 }, { x: -120, y: -160, duration: 30, ease: "sine.inOut" }, 0);
      tl.fromTo("#blob-c", { x: 0, y: 0 }, { x: 110, y: -120, duration: 30, ease: "sine.inOut" }, 0);
      tl.fromTo("#blob-d", { x: 0, y: 0 }, { x: -90, y: 70, duration: 30, ease: "sine.inOut" }, 0);

      // The Duo rises under the title, as the 6.9" phone does.
      tl.fromTo(
        "#rig",
        { y: 1300, opacity: 0, scale: 0.94, transformOrigin: "50% 0%" },
        { y: 0, opacity: 1, scale: 1, duration: 0.9, ease: "expo.out" },
        1.92,
      );

      // Multi-sport: the camera moves in on the map and the portions.
      tl.to("#rig", { scale: 1.25, y: -70, duration: 0.7, ease: "power2.inOut" }, 17.45);
      tl.to("#rig", { scale: 1, y: 0, duration: 0.6, ease: "power2.inOut" }, 20.55);

      // Apple Watch: the Duo leaves to the left as the watch comes in.
      tl.to("#rig", { x: -1000, rotation: -4, duration: 0.55, ease: "power3.in" }, 25.75);
      tl.set("#rig", { opacity: 0 }, 26.31);

      window.__timelines["main"] = tl;
    </script>
