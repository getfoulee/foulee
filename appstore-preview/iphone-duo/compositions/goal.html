  <script>
    Foulee.apply();
    // A little burst of the ring's colours when it closes (CelebrationBurst).
    const burst = document.querySelector("#gl-burst");
    const colours = ["#bf5af2", "#34c759", "#ff9f0a", "#d97aff", "#30b0c7", "#7c3aed"];
    for (let i = 0; i < 18; i++) {
      burst.insertAdjacentHTML("beforeend", `<i class="gl-dot" style="background:${colours[i % colours.length]}"></i>`);
    }

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#gl-outer", { attr: { "stroke-dashoffset": 22 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.7, ease: "power3.inOut" }, 0.5);
    tl.fromTo("#gl-inner", { attr: { "stroke-dashoffset": 10 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.6, ease: "power3.inOut" }, 0.62);
    tl.fromTo("#gl-today-ring", { attr: { "stroke-dashoffset": 12 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.6, ease: "power3.inOut" }, 0.62);

    // Closed: the centre turns into a check, the words and the buttons change.
    tl.to("#gl-mid-feet", { opacity: 0, scale: 0.6, duration: 0.2, ease: "power2.in" }, 1.15);
    tl.fromTo("#gl-mid-done", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 1.25);
    tl.to("#gl-before", { opacity: 0, y: -8, filter: "blur(4px)", duration: 0.2, ease: "power2.in" }, 1.2);
    tl.fromTo("#gl-after", { opacity: 0, y: 8, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, 1.32);
    tl.to("#gl-act-before", { opacity: 0, duration: 0.2 }, 1.3);
    tl.fromTo("#gl-act-after", { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 1.4);
    document.querySelectorAll(".gl-dot").forEach((dot, i) => {
      const a = (i / 18) * Math.PI * 2;
      const r = 92 + (i % 3) * 14;
      tl.fromTo(dot, { x: 0, y: 0, opacity: 0, scale: 0.4 }, { x: Math.cos(a) * r, y: Math.sin(a) * r, opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 1.2);
      tl.to(dot, { opacity: 0, scale: 0.2, duration: 0.3, ease: "power2.in" }, 1.6 + (i % 4) * 0.04);
    });

    // Tap « Voir le bilan ».
    tl.fromTo("#gl-tap", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, 1.95);
    tl.to("#gl-recap", { scale: 0.96, duration: 0.09, yoyo: true, repeat: 1 }, 2.05);
    tl.to("#gl-tap", { opacity: 0, scale: 1.2, duration: 0.18 }, 2.2);
    window.__timelines["goal"] = tl;
  </script>
