  <script>
    // October 2026 starts on a Thursday. The weekdays done so far (1, 2 and
    // 5 to 9) carry a closed ring; the weekend and the days to come stay blank.
    const done = [1, 2, 5, 6, 7, 8, 9];
    const grid = document.querySelector("#sk-grid");
    const cell = (d) => {
      const isDone = done.includes(d);
      const weekend = (d + 2) % 7 === 5 || (d + 2) % 7 === 6;
      const fill = isDone ? "rgb(52 199 89 / 0.14)" : "none";
      const track = weekend && d < 10 ? "rgb(29 18 51 / 0.12)" : "rgb(29 18 51 / 0.07)";
      const dash = weekend && d < 10 ? ' stroke-dasharray="3 4"' : "";
      const ring = isDone
        ? `<circle class="sk-ring" cx="24" cy="24" r="19" fill="none" stroke="url(#g-activity)" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" transform="rotate(-90 24 24)" />`
        : "";
      return `<svg width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" fill="${fill}" stroke="${track}" stroke-width="5"${dash} />${ring}</svg>`;
    };
    let html = "<span></span><span></span><span></span>";
    for (let d = 1; d <= 31; d++) html += cell(d);
    grid.insertAdjacentHTML("beforeend", html);

    const tl = gsap.timeline({ paused: true });
    // The sheet comes up over Aujourd'hui, inset from the sides as on the Duo.
    tl.fromTo("#sk-dim", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0);
    tl.fromTo("#sk-sheet", { y: 951 }, { y: 0, duration: 0.55, ease: "expo.out" }, 0);

    const n = { v: 0 };
    tl.fromTo(n, { v: 0 }, {
      v: 12, duration: 0.9, ease: "power2.out",
      onUpdate: () => { document.querySelector("#sk-n").textContent = Math.round(n.v); },
    }, 0.35);
    tl.fromTo("#sk-fill", { scaleX: 0 }, { scaleX: 0.8, duration: 0.9, ease: "power3.out" }, 0.4);
    tl.fromTo(".sk-ring", { attr: { "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.out", stagger: 0.09 }, 0.45);
    window.__timelines["streak"] = tl;
  </script>
