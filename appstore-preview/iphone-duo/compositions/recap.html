  <script>
    Foulee.apply();
    // Monday to Friday, the minutes of each day; the weekend still to come.
    const letters = Foulee.weekdays();
    const week = [34, 22, 41, 31, 44, 0, 0].map((m, i) => [letters[i], m]);
    const row = document.querySelector("#rc-dayrow");
    week.forEach(([d, m], i) => {
      const reached = m >= 30;
      const share = Math.min(m / 30, 1) * 100;
      const ring = m
        ? `<circle class="rc-ring-day" cx="26" cy="26" r="20" fill="none" stroke="url(#g-accent)" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" data-to="${100 - share}" transform="rotate(-90 26 26)" />`
        : "";
      const fill = reached ? "rgb(52 199 89 / 0.16)" : "none";
      row.insertAdjacentHTML(
        "beforeend",
        `<div class="${i === 4 ? "today" : ""}" style="position:relative"><svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="20" fill="${fill}" stroke="rgb(29 18 51 / 0.07)" stroke-width="5" />${ring}</svg><div class="d">${d}</div><div class="m">${m || "&nbsp;"}</div></div>`,
      );
    });

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#rc-dim", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0);
    tl.fromTo("#rc-sheet", { y: 951 }, { y: 0, duration: 0.55, ease: "expo.out" }, 0);

    tl.fromTo("#rc-arc", { attr: { "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": 20 }, duration: 1.0, ease: "power3.out" }, 0.35);
    const total = { v: 0 };
    tl.fromTo(total, { v: 0 }, {
      v: 172, duration: 1.1, ease: "power2.out",
      onUpdate: () => {
        const m = Math.round(total.v);
        document.querySelector("#rc-total").textContent = Foulee.dur(m);
      },
    }, 0.35);
    tl.fromTo("#rc-up", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 1.35);
    document.querySelectorAll(".rc-ring-day").forEach((ring, i) => {
      tl.fromTo(ring, { attr: { "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": Number(ring.dataset.to) }, duration: 0.5, ease: "power2.out" }, 0.5 + i * 0.1);
    });
    tl.fromTo("#rc-today", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.15);
    tl.fromTo("#rc-cmp", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.25);

    // Tap the outing: its detail is pushed inside the sheet.
    tl.fromTo("#rc-tap", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, 2.4);
    tl.to("#rc-row", { scale: 0.98, duration: 0.09, yoyo: true, repeat: 1 }, 2.5);
    tl.to("#rc-tap", { opacity: 0, duration: 0.15 }, 2.68);
    tl.to("#rc-body", { x: -180, opacity: 0.6, duration: 0.5, ease: "power3.inOut" }, 2.75);
    window.__timelines["recap"] = tl;
  </script>
