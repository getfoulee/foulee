  <script>
    Foulee.apply();
    const tl = gsap.timeline({ paused: true });
    const nb = Foulee.nb;
    const count = (sel, from, to, at, dur, fmt) => {
      const o = { v: from };
      tl.fromTo(o, { v: from }, {
        v: to, duration: dur, ease: "power2.out",
        onUpdate: () => { document.querySelector(sel).textContent = fmt(o.v); },
      }, at);
    };

    // The rings draw as the screen appears behind the onboarding.
    tl.fromTo("#td-outer", { attr: { "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": 47 }, duration: 1.1, ease: "power3.out" }, 0.25);
    tl.fromTo("#td-inner", { attr: { "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": 60 }, duration: 1.1, ease: "power3.out" }, 0.4);
    tl.fromTo("#td-today-ring", { attr: { "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": 60 }, duration: 0.9, ease: "power3.out" }, 0.5);
    count("#td-steps", 0, 4218, 0.25, 1.1, nb);
    count("#td-min", 0, 12, 0.3, 1.0, nb);
    count("#td-km", 0, 3.1, 0.3, 1.0, (v) => Foulee.dec(v, 1));
    count("#td-kcal", 0, 214, 0.3, 1.0, nb);
    ["#td-g1", "#td-g2", "#td-g3"].forEach((id, i) => {
      tl.fromTo(id, { scaleY: 0 }, { scaleY: 0.86, duration: 0.45, ease: "power2.out" }, 0.55 + i * 0.12);
    });

    // Tap « Semaine »: the thumb slides and the week's totals replace the day's.
    tl.fromTo("#td-tap", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, 1.7);
    tl.to("#td-tap", { opacity: 0, scale: 1.2, duration: 0.18 }, 1.95);
    tl.fromTo("#td-thumb", { x: 0 }, { x: 276, duration: 0.32, ease: "power3.inOut" }, 1.8);
    tl.fromTo(".td-wk", { opacity: 0, y: 10, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power2.out", stagger: 0.04 }, 1.9);
    tl.to(["#td-day-steps", "#td-day-min", "#td-day-km", "#td-day-kcal"], { opacity: 0, y: -10, filter: "blur(4px)", duration: 0.2, ease: "power2.in", stagger: 0.04 }, 1.84);

    window.__timelines["today"] = tl;
  </script>
