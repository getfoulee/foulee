  <script>
    const tl = gsap.timeline({ paused: true });
    const W = 669;

    // Page strip: welcome, then the two questions, as the app's TabView pages.
    
    // Tap « Commencer ».
    tl.fromTo("#ob-tap1", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out" }, 0.82);
    tl.to("#ob-start", { scale: 0.96, duration: 0.1, yoyo: true, repeat: 1, ease: "power1.inOut" }, 0.92);
    tl.to("#ob-tap1", { opacity: 0, scale: 1.3, duration: 0.18, ease: "power2.in" }, 1.08);

    tl.to("#ob-p1", { x: -W, duration: 0.5, ease: "power3.inOut" }, 1.12);
    tl.fromTo("#ob-p2", { x: 0 }, { x: -W, duration: 0.5, ease: "power3.inOut" }, 1.12);
    tl.to("#ob-dots", { opacity: 1, duration: 0.25 }, 1.3);

    // Pick « Les deux ».
    tl.fromTo("#ob-tap2", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, 1.62);
    tl.to("#ob-both", { scale: 0.98, duration: 0.09, yoyo: true, repeat: 1 }, 1.72);
    tl.to("#ob-both-ring", { opacity: 1, duration: 0.15 }, 1.76);
    tl.fromTo("#ob-both-check", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 1.76);
    tl.to("#ob-tap2", { opacity: 0, duration: 0.15 }, 1.88);

    tl.to("#ob-p2", { x: -2 * W, duration: 0.5, ease: "power3.inOut" }, 2.02);
    tl.fromTo("#ob-p3", { x: 0 }, { x: -W, duration: 0.5, ease: "power3.inOut" }, 2.02);
    tl.set("#ob-d1", { attr: { class: "done" } }, 1.3);
    tl.set("#ob-d2", { attr: { class: "on" } }, 1.3);
    tl.set("#ob-d2", { attr: { class: "done" } }, 2.2);
    tl.set("#ob-d3", { attr: { class: "on" } }, 2.2);

    // The weekdays light up one after the other, then the goal goes 20 → 30.
    for (let i = 1; i <= 5; i++) {
      tl.fromTo(`#ob-day${i}`, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "back.out(1.8)" }, 2.45 + (i - 1) * 0.09);
    }
    const goal = { m: 20 };
    tl.fromTo("#ob-fill", { scaleX: 0.2 }, { scaleX: 0.4, duration: 0.55, ease: "power2.inOut" }, 2.9);
    tl.fromTo("#ob-knob", { x: 0.2 * 560 }, { x: 0.4 * 560, duration: 0.55, ease: "power2.inOut" }, 2.9);
    tl.fromTo(
      goal,
      { m: 20 },
      {
        m: 30,
        duration: 0.55,
        ease: "power2.inOut",
        onUpdate: () => {
          document.querySelector("#ob-min").textContent = Math.round(goal.m);
        },
      },
      2.9,
    );

    // Off to the left, onto the home screen underneath.
    tl.to("#ob-app", { x: -W, duration: 0.5, ease: "power3.inOut" }, 3.22);
    window.__timelines["onboarding"] = tl;
  </script>
